<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Servo Sprint has moved to servosprint.xyz</title>
  <!-- Servo Sprint moved to https://servosprint.xyz. GitHub Pages has no server redirects, so this page forwards
       right away and keeps the full query and hash: challenge links (?c=&s=&n=) and Daily links (?daily) still
       open the right mode. Passkeys are unaffected: /.well-known/webauthn on auamai.dev lists servosprint.xyz. -->
  <script>location.replace("https://servosprint.xyz/" + location.search + location.hash);</script>
  <noscript><meta http-equiv="refresh" content="0; url=https://servosprint.xyz/" /></noscript>
  <link rel="canonical" href="https://servosprint.xyz/" />
  <meta name="robots" content="noindex, follow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f6fb" />
  <link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml" />
  <style>
    @font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 300 500; font-display: swap; src: url("../fonts/inter-tight-var.woff2") format("woff2"); }
    html, body { margin: 0; height: 100%; background: #f4f6fb; }
    body { display: grid; place-items: center; font: 300 16px/1.6 "Inter Tight", system-ui, sans-serif; color: rgba(16, 22, 47, .64); }
    p { margin: 0; padding: 24px; text-align: center; }
    a { color: #4f63c4; text-decoration: none; border-bottom: 1px solid rgba(79, 99, 196, .3); }
    a:hover, a:focus-visible { border-bottom-color: #4f63c4; outline: none; }
  </style>
</head>
<body>
  <p>Servo Sprint has moved. <a id="go" href="https://servosprint.xyz/">Play at servosprint.xyz</a></p>
  <script>document.getElementById("go").href = "https://servosprint.xyz/" + location.search + location.hash;</script>
</body>
</html>
