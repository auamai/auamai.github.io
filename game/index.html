<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Factory run | Alex Uamai</title>
  <meta name="description" content="A small 3D runner by Alex Uamai. Collect gears, dodge the machines." />
  <meta name="theme-color" content="#f4f6fb" />
  <link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #f4f6fb; overscroll-behavior: none; }
    .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 300 15px/1.5 "Inter Tight", system-ui, sans-serif; color: rgba(16, 22, 47, .6); }
    .boot__in { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 24px; }
    .boot__bar { width: 140px; height: 2px; border-radius: 2px; background: rgba(16, 22, 47, .08); overflow: hidden; }
    .boot__bar::after { content: ""; display: block; width: 40%; height: 100%; background: #4f63c4; animation: boot 1.1s ease-in-out infinite; }
    @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    .boot a { color: #4f63c4; }
    @media (prefers-reduced-motion: reduce) { .boot__bar::after { animation: none; width: 100%; opacity: .5; } }
  </style>
</head>
<body>
  <div class="boot" id="fr-boot" role="status" aria-live="polite">
    <div class="boot__in"><span>Loading the floor…</span><span class="boot__bar" aria-hidden="true"></span></div>
  </div>
  <noscript>Factory run needs JavaScript.</noscript>
  <script type="module">
    const boot = document.getElementById("fr-boot");
    import("./game.js?v=20261020r5")
      .then(({ openGame }) => openGame({ standalone: true, exitUrl: "../" }))
      .then(() => boot.remove())
      .catch((err) => {
        console.error(err);
        boot.innerHTML = '<div class="boot__in"><span>Couldn\'t load the game. Check your connection.</span><a href="">Try again</a></div>';
      });
  </script>
</body>
</html>
