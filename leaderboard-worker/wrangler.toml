name = "auamai-leaderboard"
main = "src/index.js"
compatibility_date = "2025-10-01"

# Deployed at https://api.auamai.dev (custom domain).
[[d1_databases]]
binding = "DB"
database_name = "auamai-leaderboard"
database_id = "0088edc7-5229-4028-8f3e-63b61d4160a9"

[vars]
# Comma-separated origins allowed to call the API from a browser.
ALLOWED_ORIGINS = "https://servosprint.xyz,https://www.servosprint.xyz,https://auamai.dev,https://www.auamai.dev"
# Temporary, while the preview is in use (remove after launch): append ",https://servosprint.auamai.workers.dev".
# auamai.github.io was dropped: GitHub Pages redirects it to auamai.dev, so no page ever calls from there.
# CODE_PEPPER (optional secret, wrangler secret put CODE_PEPPER, >= 16 chars): save codes are then stored as
# HMAC(pepper). Once set, never remove or change it, or every upgraded save code stops matching.
# Cloudflare Access, used only by GET /stats. Not secrets, but fill them in
# before deploying; /stats denies every request while they are empty.
ACCESS_TEAM_DOMAIN = ""   # e.g. "yourteam.cloudflareaccess.com"
ACCESS_AUD = ""           # the Access application's AUD tag

# Daily salt rotation and cleanup of old visit hashes / rate-limit rows.
[triggers]
crons = ["5 0 * * *"]
